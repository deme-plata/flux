[package]
name = "flux-recursive-proofs"
version.workspace = true
edition = "2021"
authors = ["Q-NarwhalKnight Team"]
description = "Post-Quantum Recursive SNARKs for Eliminating Weak Subjectivity"
license = "MIT"
readme = "README.md"

[features]
# Default enables the full runtime — q-api-server's expected feature set.
default = ["parallel", "runtime"]
# rayon-based parallel NTT in q-lattice-guard.
parallel = ["rayon", "flux-lattice-guard/parallel", "flux-ivc/parallel"]
# Tokio + libp2p — required for block_producer_task, light_client,
# and the P2P protocol module. Wasm consumers disable this to drop
# the heavy network-runtime deps.
runtime = ["tokio", "libp2p", "futures", "flux-ivc/runtime"]
gpu = []  # Future GPU acceleration
benchmarks = ["dep:criterion"]

[dependencies]
# Core Q-NarwhalKnight crates
flux-lattice-guard = { path = "../flux-lattice-guard", default-features = false }
flux-zk-types = { path = "../flux-zk-types" }
# Phase B1: tip_proof_v2 wraps the per-step LatticeStepProof from q-ivc.
# q-ivc depends on q-lattice-guard (not on q-recursive-proofs) so this
# dependency is acyclic. `default-features = false` so q-ivc's tokio
# usage is gated by the `runtime` feature below.
flux-ivc = { path = "../flux-ivc", default-features = false }
ark-ff = { workspace = true }
ark-relations = { workspace = true }

# Core dependencies
anyhow = { workspace = true }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
bytes = "1.5"
hex = "0.4"

# Cryptographic foundations
sha3 = "0.10"
blake3 = "1.5"
rand = "0.8"
rand_core = "0.6"
rand_chacha = "0.3"

# Number theory
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"

# Parallel processing
rayon = { version = "1.10", optional = true }
num_cpus = "1.16"

# Async runtime — feature-gated to `runtime` for wasm compat.
tokio = { workspace = true, features = ["full", "sync"], optional = true }
futures = { version = "0.3", optional = true }

# libp2p for decentralized proving — feature-gated to `runtime`.
libp2p = { workspace = true, optional = true }

# Serialization
rmp-serde = "1.1"

# Tracing
tracing = { workspace = true }

# Benchmarking
criterion = { version = "0.5", optional = true, default-features = false, features = ["cargo_bench_support"] }

[dev-dependencies]
proptest = "1.4"
tokio-test = "0.4"

[[bench]]
name = "recursive_proof_bench"
harness = false
required-features = ["benchmarks"]

# Path C measurement layer — measures the structural verify cost wallets pay
# today via q-ivc-verifier-wasm. See plan at
# /root/.claude/plans/precious-watching-clock.md (IVC + 10ms Verification).
[[bench]]
name = "tip_proof_verify_bench"
harness = false
required-features = ["benchmarks"]
