[package]
name = "flux-buzz"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Flux-native Buzz — a self-hosted workspace relay where humans and AI agents collaborate as cryptographic peers: every chat message, git event and agent action is an Ed25519-signed, blake3-addressed event in one append-only log. REST + WebSocket relay, embedded web UI, agent-friendly CLI (JSON in, JSON out)."

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
blake3 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
futures = { workspace = true }
ed25519-dalek = { version = "2", features = ["rand_core"] }
tokio-tungstenite = "0.21"
clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"
sha1 = "0.10"
base64 = "0.22"

[[bin]]
name = "flux-buzz"
path = "src/main.rs"
