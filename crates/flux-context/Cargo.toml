[package]
name = "flux-context"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "flux-context — measure and optimize how an AI agent spends its (1M-token) context window. Inventories every loaded context source (CLAUDE.md, the memory index, skill docs, the tool catalog, file reads, conversation) with its token cost, and computes the Context Utilization Ratio (CUR) = tokens-referenced / tokens-loaded. The optimizer flags dead weight (large + loaded + unreferenced) and recommends levers: slice the runbook, top-K the memory, digest the skill doc, or proactively resident-load a whole subsystem's source instead of Read-ing 200 lines at a time. Pairs with X-Algo: predict CUR before a task, measure after, feed back to calibrate."

# Separate crate (not a fluxc-core edit) because context budgeting is a
# cross-cutting *measurement* concern with its own data model and rubric, the
# same way flux-glossary is data+rubric independent of flux-search. fluxc-mcp
# will depend on it for the flux_context_audit tool; X-Algo can depend on it to
# fold CUR into its prediction loop.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 1M-context plan Task 1: semantic chunking reuses the workspace dep DAG instead
# of re-parsing manifests. flux-graph already resolves crates + path-deps + batches.
flux-graph = { path = "../flux-graph" }
# Task 2 context-diff: BLAKE3 content fingerprints (hash_bytes) + content-addressed
# snapshot persistence (.flux-rev Store). Don't hand-roll a hasher.
flux-rev = { path = "../flux-rev" }
# Task 4 model dispatch: the router picks a tier + chunk slice; flux-moe's generate()
# endpoint-switch (ollama local-qwen / DeepSeek OpenAI API) actually runs the model.
flux-moe = { path = "../flux-moe" }

# Chunk-manifest writer: `flux-context-chunks [workspace_root]` → .whale/context/chunks.json
[[bin]]
name = "flux-context-chunks"
path = "src/bin/flux-context-chunks.rs"

# Context-diff: `flux-context-diff [workspace_root] [--save]` — diff vs latest snapshot
[[bin]]
name = "flux-context-diff"
path = "src/bin/flux-context-diff.rs"

# Context-watch daemon: `flux-context-watch [root] [--status|--once|--poll N]`
[[bin]]
name = "flux-context-watch"
path = "src/bin/flux-context-watch.rs"

# Context router: `flux-context-route [root] --task read|edit|refactor|review|audit|build|swarm`
[[bin]]
name = "flux-context-route"
path = "src/bin/flux-context-route.rs"
