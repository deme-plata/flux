[package]
name = "flux-rocksdb"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Flux RocksDB — RocksDB-compatible LSM engine: io_uring WAL, SIMD BLAKE3 checksums, SST files, compaction, block cache"

[dependencies]
blake3 = "1"
bytes = "1"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
tracing = "0.1"
