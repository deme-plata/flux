[package]
name = "flux-qwen-batch"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Flux Qwen Batch — drive qwen3.6 (ollama) with big parallel batches. The 'bigger packages = more efficient' lever, FLUXFOOD-minimal (std + serde_json, no tokio/reqwest → fast compiles)."

[dependencies]
