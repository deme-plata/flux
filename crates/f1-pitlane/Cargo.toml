[package]
name = "f1-pitlane"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "F1-Pitlane: become the driver. A Flux-native career game — fix the tyres, perfect every car part within the real 2026 F1 technical regulations, then race the real 2026 Grand Prix calendar. The garage/regs/career model is real, tested Rust that backs the browser game; a JSON snapshot bridges it to f1-pitlane.html."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[lib]
name = "f1_pitlane"
path = "src/lib.rs"

[[bin]]
name = "f1-pitlane"
path = "src/main.rs"
