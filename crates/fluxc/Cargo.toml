[package]
name = "fluxc"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "fluxc"
path = "src/main.rs"

[dependencies]
fluxc-serve = { path = "../fluxc-serve" }
fluxc-webhooks = { path = "../fluxc-webhooks" }
fluxc-analytics = { path = "../fluxc-analytics" }
fluxc-util = { path = "../fluxc-util" }
fluxc-core = { path = "../fluxc-core" }
fluxc-mcp = { path = "../fluxc-mcp" }
flux-webcam = { path = "../flux-webcam" }
flux-sigil-releases = { path = "../flux-sigil-releases" }
flux-graph = { path = "../flux-graph" }
serde_json = "1"
# prune-report: parse workspace/crate manifests for the dep-graph walk
toml = "0.8"

# stdin-poison guard: dup2(/dev/null, 0) before build-family subcommands
[target.'cfg(unix)'.dependencies]
libc = "0.2"
