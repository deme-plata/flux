[package]
name = "fluxc-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fluxc-core = { path = "../fluxc-core" }
flux-context = { path = "../flux-context" }
flux-legacy = { path = "../flux-legacy" }
flux-extension = { path = "../flux-extension" }
