[package]
name = "flux-wireguard"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Flux WireGuard — High-performance WireGuard VPN: io_uring packet I/O, SIMD ChaCha20Poly1305, lock-free peer table, zero-copy forwarding, Noise handshake acceleration"

[dependencies]
tokio = { version = "1", features = ["full"] }
# io_uring for zero-syscall packet I/O
tokio-uring = { version = "0.5", optional = true }
# SIMD-accelerated WireGuard crypto suite
chacha20poly1305 = "0.10"
blake3 = "1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
# Noise protocol framework
snow = "0.9"
# Zero-copy buffer management
bytes = "1"
# Lock-free peer table
crossbeam = "0.8"
parking_lot = "0.12"
# Serde for config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Base64 for keys
base64 = "0.22"
# IP parsing
ipnet = "2"
rand = "0.8"
hex = "0.4"
# Async traits
async-trait = "0.1"
# Tracing
tracing = "0.1"

[features]
default = []
iouring = ["tokio-uring"]
simd = []

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
tokio-uring = "0.5"
