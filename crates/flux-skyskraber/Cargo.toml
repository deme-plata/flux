[package]
name = "flux-skyskraber"
version = "0.1.0"
edition = "2021"
description = "Quillon Graph Skyskraber — digital twin of the tower: robot elevator transport, basement gold vault, Quillon bank organ, grand auditorium, SAP/X-algo scored building cortex, flux-api MCP surface."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
blake3 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
inventory = "0.3"

# The building stands on real Flux organs, not imagined ones:
flux-p2p = { path = "../flux-p2p" }             # sap::ScoreTable + x_algo::CrossScoreTable
flux-bank-core = { path = "../flux-bank-core" } # Ledger / TransferProposal / SignedIntent
flux-api = { path = "../flux-api" }             # #[api] endpoint registry → OpenAPI/MCP
flux-api-macros = { path = "../flux-api-macros" }
flux-science = { path = "../flux-science" }     # CODATA constants for the science annex

[[bin]]
name = "skyskraber"
path = "src/main.rs"

[[bin]]
name = "skyskraber-whitepaper"
path = "src/bin/whitepaper.rs"

[features]
datacenter = ["dep:tokio", "dep:axum", "dep:reqwest", "dep:fs2", "dep:flux-aether", "dep:flux-refactor", "dep:flux-cortex", "dep:flux-graph", "dep:flux-optimize"]

[dependencies.tokio]
version = "1"
features = ["full"]
optional = true
[dependencies.axum]
version = "0.7"
optional = true
[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["json", "rustls-tls", "stream"]
optional = true
[dependencies.fs2]
version = "0.4"
optional = true
[dependencies.flux-aether]
path = "../flux-aether"
optional = true
[dependencies.flux-refactor]
path = "../flux-refactor"
optional = true
[dependencies.flux-cortex]
path = "../flux-cortex"
optional = true
[dependencies.flux-graph]
path = "../flux-graph"
optional = true
[dependencies.flux-optimize]
path = "../flux-optimize"
optional = true

[[bin]]
name = "quillon-datacenter"
path = "src/bin/quillon-datacenter.rs"
required-features = ["datacenter"]
