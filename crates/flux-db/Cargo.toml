[package]
name = "flux-db"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Flux DB — Embedded LSM-tree database for Rust. RocksDB-inspired, Rust-native, LZ4-compressed."

[dependencies]
blake3 = "1"
lz4 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
crc32fast = "1"

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7"