[package]
name = "flux-tip-proof-stir"
version.workspace = true
edition = "2021"
description = "Windowed FRI tip proof for Quillon — wraps flux-zk-stark with anchor-chain + binding-commit"

[dependencies]
flux-zk-stark = { path = "../flux-zk-stark", default-features = false }
flux-recursive-proofs = { path = "../flux-recursive-proofs" }
blake3 = "1.5"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
thiserror = "1.0"
anyhow = "1.0"
tokio = { version = "1", features = ["sync", "rt", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

