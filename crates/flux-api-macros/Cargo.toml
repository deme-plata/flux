[package]
name = "flux-api-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Procedural macros for flux-api — #[api(METHOD, \"/path\")] attribute that registers endpoints via the inventory crate at compile time."

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
