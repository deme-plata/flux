[package]
name = "flux-science"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Flux Science — Quantum gravity, black hole evolution, cosmological inflation, holographic theory. GPU-accelerated via flux-gpu."

[dependencies]
# Math
ndarray = "0.15"
nalgebra = "0.32"

# Crypto (for quantum-safe hashing)
blake3 = "1"

# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Concurrency
parking_lot = "0.12"

# Utils
tracing = "0.1"

[dev-dependencies]
approx = "0.5"
