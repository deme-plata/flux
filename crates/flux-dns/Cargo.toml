[package]
name = "flux-dns"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Flux DNS — High-performance DNS resolver: io_uring UDP, SIMD name compression, DNSSEC, lock-free query table, TTL cache"

[dependencies]
tokio = { version = "1", features = ["full"] }
bytes = "1"
blake3 = "1"
rand = "0.8"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
base64 = "0.22"
