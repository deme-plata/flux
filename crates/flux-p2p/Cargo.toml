[package]
name = "flux-p2p"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Flux P2P — libp2p-rust with DAGKnight native support, SAP/X-algo scoring, QUIC transport"

[features]
default = []
quic = ["libp2p/quic"]
# v0.8's "Cortex-driven autonomous P2P optimization" (src/cortex_optimizer.rs) pulls in
# flux-cortex + flux-graph + flux-optimize — flux-cortex alone is a ~40-crate transitive
# closure (the whole Autonomous Continuous Optimization Engine / AI-agent-registry stack)
# for a self-contained, opt-in-only feature that nothing outside this crate calls (verified
# 2026-08-21: zero external references to `cortex_optimizer` in flux/ or sigil/). Every
# consumer of flux-p2p that just wants networking — sigil-node, sigil-top, sigil-net, and
# most other flux-p2p users — was paying that compile cost unconditionally. Now opt-in.
cortex-optimizer = ["dep:flux-cortex", "dep:flux-graph", "dep:flux-optimize"]

[dependencies]
# libp2p core
libp2p = { version = "0.54", features = [
    "tokio",
    "gossipsub",
    "kad",
    "identify",
    "ping",
    "noise",
    "yamux",
    "tcp",
    "dns",
    "macros",
    "request-response",
    "cbor",
] }
tokio = { version = "1", features = ["full"] }

# Crypto
blake3 = "1"
sha3 = "0.10"

# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Cortex-driven autonomous optimization (opt-in, see [features].cortex-optimizer above)
flux-cortex = { path = "../flux-cortex", optional = true }
flux-graph = { path = "../flux-graph", optional = true }
flux-optimize = { path = "../flux-optimize", optional = true }
# Content-addressed block backfill (closes the gossip-only "no history" gap).
flux-sync = { path = "../flux-sync" }

# Utils
parking_lot = "0.12"
# v0.32: enumerate local interface IPs to skip hairpin self-dials (own public IP as bootstrap).
if-addrs = "0.15"
tracing = "0.1"
hex = "0.4"
async-trait = "0.1"
futures = "0.3"

[[bin]]
name = "flux-p2p-test"
path = "src/bin/test_mesh.rs"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
