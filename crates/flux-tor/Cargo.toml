[package]
name = "flux-tor"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Flux Tor — High-performance Tor onion router: io_uring sockets, SIMD crypto, zero-copy cells, async circuits, BBR congestion control"

[dependencies]
tokio = { version = "1", features = ["full"] }
# io_uring for zero-syscall socket I/O
tokio-uring = { version = "0.5", optional = true }
# SIMD-accelerated crypto: AES-NI + ChaCha20
aes = "0.8"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
blake3 = "1"
# Zero-copy buffer management
bytes = "1"
# Lock-free concurrency
crossbeam = "0.8"
parking_lot = "0.12"
# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Async traits
async-trait = "0.1"
# TLS for Tor link protocol
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12", "logging"] }
# X.509 for relay identity
x509-parser = "0.16"
# Base64 for onion addresses
base64 = "0.22"
# Tracing
tracing = "0.1"
rand = "0.8"

[features]
default = []
iouring = ["tokio-uring"]
simd = []

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
tokio-uring = "0.5"
