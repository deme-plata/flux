[package]
name = "flux-policy"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "flux-policy — the auto-calibrating multi-engine powerplant for Flux/SIGIL. Metrics → policy → param changes, adopted WITHOUT recompiling (env vars the runtime sources) yet refined WITH recompiling (code) in one iterative loop. Named engine profiles (koenigsegg=peak-speed, jet=throughput, yacht=sustained-efficiency, rocket=burst) the policy auto-shifts between per regime, fed by the flux webhook surface, exposed via MCP. SIGIL adopts the param registry (the gossipsub knobs already are env-tunable)."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
