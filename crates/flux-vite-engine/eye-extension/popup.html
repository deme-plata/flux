<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Flux Eye</title>
  <style>
    body { width: 280px; margin: 0; padding: 16px; font-family: -apple-system, system-ui, sans-serif;
           background: linear-gradient(180deg, #1a1428, #0a0a0f); color: #e2e8f0; font-size: 13px; }
    h1 { font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: #c084fc; margin: 0 0 12px; font-weight: 700; }
    h1 .em { color: #fbbf24; }
    .row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(139,92,246,0.18); font-size: 11px; }
    .row:last-child { border-bottom: 0; }
    .row .k { color: #94a3b8; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; font-size: 10px; }
    .row .v { color: #fbbf24; font-feature-settings: "tnum"; font-weight: 700; }
    .row .v.ok { color: #4ade80; }
    .row .v.no { color: #f87171; }
    .host { padding: 10px 12px; background: rgba(2,6,23,0.55); border: 1px solid rgba(139,92,246,0.30);
            border-radius: 8px; color: #c084fc; font-family: 'JetBrains Mono', monospace; font-size: 11px;
            margin: 8px 0 12px; word-break: break-all; }
    .btn { width: 100%; padding: 10px; background: linear-gradient(135deg, #fbbf24, #d97706); color: #0a0a0f;
           border: 0; border-radius: 8px; font-family: inherit; font-weight: 700; font-size: 11px;
           letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; margin-top: 8px; }
    .hint { font-size: 10px; color: #64748b; margin-top: 10px; line-height: 1.6; }
  </style>
</head>
<body>
  <h1>👁 Flux <span class="em">Eye</span></h1>
  <div id="updateBanner" style="display:none;padding:10px 12px;margin-bottom:10px;
    background:linear-gradient(135deg,rgba(74,222,128,0.18),rgba(34,197,94,0.18));
    border:1px solid rgba(74,222,128,0.45);border-radius:8px;color:#4ade80;font-size:11px;">
    🆕 <b id="updateVer">—</b> available
    <div style="font-size:10px;color:#a7f3d0;margin-top:4px;line-height:1.5;" id="updateNotes">—</div>
    <button id="updateBtn" style="margin-top:8px;width:100%;padding:8px;background:linear-gradient(135deg,#4ade80,#16a34a);color:#0a0a0f;border:0;border-radius:6px;font-family:inherit;font-weight:700;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer;">⬇ download + open chrome://extensions</button>
  </div>
  <div class="host" id="host">—</div>
  <div class="row"><span class="k">Server</span><span class="v" id="srv">…</span></div>
  <div class="row"><span class="k">Wallet tab</span><span class="v" id="tab">…</span></div>
  <div class="row"><span class="k">Site access</span><span class="v" id="perm">…</span></div>
  <div class="row"><span class="k">Queue depth</span><span class="v" id="q">…</span></div>
  <div class="row"><span class="k">Last snap</span><span class="v" id="snap">…</span></div>
  <button class="btn" id="grantBtn" style="background:linear-gradient(135deg,#8b5cf6,#7c3aed);color:#fff;display:none;">🔓 grant site access</button>
  <input id="snapComment" type="text" placeholder="comment (optional, sent with snapshot)" maxlength="200" style="width:100%;padding:8px 10px;margin-top:8px;background:rgba(2,6,23,0.55);border:1px solid rgba(139,92,246,0.30);border-radius:6px;color:#e2e8f0;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;outline:0;box-sizing:border-box;" />
  <button class="btn" id="snapBtn">⚡ snapshot now</button>
  <div style="margin-top:10px;display:flex;align-items:center;gap:8px;">
    <button class="listen" id="listenBtn" style="flex:1;padding:8px;background:rgba(2,6,23,0.55);border:1px solid rgba(192,132,252,0.40);color:#c084fc;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;border-radius:6px;cursor:pointer;">📡 listen for cmds</button>
    <span id="listenStatus" style="font-size:9px;color:#64748b;letter-spacing:0.06em;min-width:50px;">idle</span>
  </div>
  <div style="margin-top:10px;font-size:9px;letter-spacing:0.16em;text-transform:uppercase;color:#94a3b8;font-weight:700;">🧪 click + snap (each panel)</div>
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-top:6px;">
    <button class="cs" data-id="rbAddressBook" data-panel="ab" title="Address Book">📇 ab</button>
    <button class="cs" data-id="rbSettings" data-panel="settings" title="Settings">⚙ stg</button>
    <button class="cs" data-id="rbMine" data-panel="mine" title="Mining">⛏ mn</button>
    <button class="cs" data-id="rbDag" data-panel="dag" title="DAG-Knight">🜬 dag</button>
    <button class="cs" data-id="rbMint" data-panel="mint" title="Mint Hub">✦ mt</button>
    <button class="cs" data-id="rbTokens" data-panel="tok" title="Tokens">🜉 tk</button>
  </div>
  <style>
    .cs { padding: 7px 4px; background: rgba(2,6,23,0.55); border: 1px solid rgba(139,92,246,0.30);
          color: #c084fc; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px;
          letter-spacing: 0.06em; border-radius: 5px; cursor: pointer; font-weight: 700; }
    .cs:hover { background: #c084fc; color: #0a0a0f; }
    .cs:disabled { opacity: 0.45; cursor: wait; }
  </style>
  <button class="btn" id="optBtn" style="background:rgba(2,6,23,0.6);color:#c084fc;border:1px solid rgba(139,92,246,0.30);">⚙ change host</button>
  <div class="hint">Polls the dev host every 1.5s for commands. Auto-snapshots the wallet's panel state every 3.5s. Configure host in the options page.</div>
  <script src="popup.js"></script>
</body>
</html>
