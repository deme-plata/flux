[package]
name = "flux-cache"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# v0.11: binary serialization. bincode 1.x is the legacy serde-compatible API;
# 2.x has a different (non-serde) story so we pin to 1.x for compatibility.
bincode = "1"
memmap2 = "0.9"
parking_lot = "0.12"
