[package]
name = "flux-moe"
version.workspace = true
edition = "2021"
license = "MIT OR Apache-2.0"
description = "flux-moe — mixture-of-models router + trainer"

[dependencies]
# OPTIONAL since 2026-09-06. fluxc-core and fluxc-serve are Unix-only (UnixStream,
# std::os::unix::fs::symlink), so any crate that depends on flux-moe unconditionally
# cannot cross-compile to Windows. sigil-top hit exactly that: adding flux-moe for
# `antivirus` dragged the whole fluxc stack into the windows-gnu graph and the v8.0.6
# release failed at E0433 — while v8.0.5, without the dependency, built fine.
#
# Only ONE function in this crate uses them (`goalroute::route_from_consensus`), so the
# heavy half is now a feature. Default-on, so nothing that depends on flux-moe today
# changes; a portable consumer asks for `default-features = false`.
fluxc-analytics = { path = "../fluxc-analytics", optional = true }
fluxc-serve = { path = "../fluxc-serve", optional = true }
fluxc-core = { path = "../fluxc-core", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }

[[bin]]
name = "flux-moe"
path = "src/bin/flux-moe.rs"

[[bin]]
name = "flux-hundred"
path = "src/bin/flux-hundred.rs"

[[bin]]
name = "flux-twomind"
path = "src/bin/flux-twomind.rs"

[features]
# The fluxc integration: goal-consensus routing. Unix-only, hence separable.
default = ["fluxc"]
fluxc = ["dep:fluxc-analytics", "dep:fluxc-serve", "dep:fluxc-core"]
