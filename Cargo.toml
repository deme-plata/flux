[workspace]
members = [
    "crates/flux-kyberkem",
    "crates/sigil-cosmos-core",
    "crates/sigil-cosmos-mcp","crates/*"]
resolver = "2"

[workspace.package]
version = "0.34.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/flux-lang/flux"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
blake3 = "1.5"
sha3 = "0.10"
rand = "0.8"
rand_chacha = "0.3"
hex = "0.4"
bincode = "1.3"
crossbeam = "0.8"
rayon = "1.10"
lazy_static = "1.4"
once_cell = "1.19"
num_cpus = "1.16"
# Arkworks ZK stack (used by flux-zk-snark, flux-ivc, flux-recursive-proofs)
ark-ff = "0.4"
ark-ec = "0.4"
ark-serialize = "0.4"
ark-std = "0.4"
ark-bn254 = "0.4"
ark-bls12-381 = "0.4"
ark-groth16 = "0.4"
ark-poly = "0.4"
ark-poly-commit = "0.4"
ark-r1cs-std = "0.4"
ark-relations = "0.4"
ark-snark = "0.4"
ark-marlin = "0.3"
libp2p = "0.53"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.4"
futures = "0.3"
bytes = "1.5"
rmp-serde = "1.1"
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
rand_core = "0.6"

[profile.dev]
opt-level = 1
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1