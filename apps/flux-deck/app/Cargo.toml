[package]
name = "flux-deck"
version = "0.13.0"
edition = "2021"
# Generated by flux-fcx (FCX-PACK). Authored in FCX/TS, rendered by Slint. + flux auto-updater + full PTY.

[dependencies]
# software renderer + winit = pure Rust, cross-compiles clean (skia/femtovg do NOT).
slint = { version = "1", default-features = false, features = ["compat-1-2", "std", "renderer-software", "backend-winit"] }
# auto-updater HTTP — native-tls (SChannel) for windows-gnu HTTPS; rustls fails silently on the cross-built exe.
reqwest = { version = "0.11", default-features = false, features = ["blocking", "native-tls"] }
# v0.5 full PTY: real pseudo-terminal (ConPTY on Windows) + a VT parser → a real terminal screen
# (ANSI colors, cursor moves, clears, TUI apps render). Replaces v0.4's dumb piped stdio.
portable-pty = "0.8"
vt100 = "0.15"

[build-dependencies]
slint-build = "1"

# tiny release binary (the Electron-killer flex)
[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1

[workspace]
