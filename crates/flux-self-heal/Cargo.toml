[package]
name = "flux-self-heal"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Flux Self-Heal — Auto-detect + hot-swap failures in P2P swarm, DAGKnight, SAP scoring"

[dependencies]
flux-p2p = { path = "../flux-p2p" }
flux-hotswap = { path = "../flux-hotswap" }
flux-sniff = { path = "../flux-sniff" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
parking_lot = "0.12"
