[package]
name = "fluxc-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fluxc-core = { path = "../fluxc-core" }
flux-context = { path = "../flux-context" }
flux-legacy = { path = "../flux-legacy" }
flux-extension = { path = "../flux-extension" }
flux-archive = { path = "../flux-archive" }
flux-swarm-tools = { path = "../flux-swarm-tools" }
flux-search = { path = "../flux-search" }
flux-aether = { path = "../flux-aether" }
base64 = "0.21"
flux-gpu = { path = "../flux-gpu" }
flux-gpu-market = { path = "../flux-gpu-market" }
flux-0x = { path = "../flux-0x" }
flux-zk = { path = "../flux-zk", features = ["pq"] }
flux-sniff = { path = "../flux-sniff" }
flux-refactor = { path = "../flux-refactor" }
flux-bench = { path = "../flux-bench" }
flux-sqisign = { path = "../flux-sqisign" }
flux-api = { path = "../flux-api" }
flux-optimize = { path = "../flux-optimize" }
flux-graph = { path = "../flux-graph" }
flux-ai = { path = "../flux-ai" }
flux-chronos = { path = "../flux-chronos" }
flux-bank-mcp = { path = "../flux-bank-mcp" }
sigil-cosmos-mcp = { path = "../sigil-cosmos-mcp" }
flux-moe = { path = "../flux-moe" }
flux-cortex = { path = "../flux-cortex" }
flux-webcam = { path = "../flux-webcam" }
flux-rev = { path = "../flux-rev" }
flux-p2p = { path = "../flux-p2p" }
serde_json = "1"
serde = { version = "1.0", features = ["derive"] }
blake3 = "1.5"
ed25519-dalek = "2"
rand = "0.8"
hex = "0.4"
ureq = "2"
# Used by handlers/wallet_xray.rs (HEX_RE/INLINE_STYLE_RE/TW_RE) + stats/ops/frontend
# but were never declared → fresh `fluxc` builds failed (cached binary hid it).
regex = "1"
lazy_static = "1.4"
flux-agora-stargate-mcp = { path = "../flux-agora-stargate-mcp" }
sigil-dao-bridge-mcp = { path = "../sigil-dao-bridge-mcp" }
