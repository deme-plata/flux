[package]
name = "flux-moe"
version.workspace = true
edition = "2021"
license = "MIT OR Apache-2.0"
description = "flux-moe — mixture-of-models router + trainer"

[dependencies]
fluxc-analytics = { path = "../fluxc-analytics" }
fluxc-serve = { path = "../fluxc-serve" }
fluxc-core = { path = "../fluxc-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }

[[bin]]
name = "flux-moe"
path = "src/bin/flux-moe.rs"

[[bin]]
name = "flux-hundred"
path = "src/bin/flux-hundred.rs"

[[bin]]
name = "flux-twomind"
path = "src/bin/flux-twomind.rs"
