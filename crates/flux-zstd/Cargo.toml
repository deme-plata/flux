[package]
name = "flux-zstd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Flux Zstd — SIMD-accelerated Zstandard compression: AVX-512 match finder, streaming API, dictionary training, io_uring I/O"

[dependencies]
blake3 = "1"
bytes = "1"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
tracing = "0.1"
