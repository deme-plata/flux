[workspace]
members = [
    "crates/flux-kyberkem",
    "crates/sigil-cosmos-core",
    "crates/sigil-cosmos-mcp","crates/*"]
# v0.36 task #6 (SDE groundwork): `cargo build`/`fluxc build` with no -p now
# builds ONLY the load-bearing core — the 10 roots (fluxc, fluxc-core,
# fluxc-mcp, flux-frontend, flux-backend, flux-cache, flux-driver, flux-db,
# flux-rev, flux-aether) plus their full path-dep closure (incl. dev/build
# deps), 60 of 143 crates. The other 83 stay members (still addressable via
# -p / --workspace) but no longer tax the default build. Regenerate this list
# with `fluxc prune-report` (which also reports the unreachable set).
default-members = [
    "crates/flux-0x",
    "crates/flux-aether",
    "crates/flux-agora-stargate",
    "crates/flux-agora-stargate-mcp",
    "crates/flux-ai",
    "crates/flux-api",
    "crates/flux-api-macros",
    "crates/flux-architect",
    "crates/flux-archive",
    "crates/flux-backend",
    "crates/flux-bank-api",
    "crates/flux-bank-bridge",
    "crates/flux-bank-core",
    "crates/flux-bank-mcp",
    "crates/flux-bench",
    "crates/flux-cache",
    "crates/flux-chronos",
    "crates/flux-context",
    "crates/flux-cortex",
    "crates/flux-db",
    "crates/flux-driver",
    "crates/flux-email",
    "crates/flux-extension",
    "crates/flux-frontend",
    "crates/flux-gpu",
    "crates/flux-gpu-market",
    "crates/flux-graph",
    "crates/flux-hotswap",
    "crates/flux-ivc",
    "crates/flux-lattice-guard",
    "crates/flux-legacy",
    "crates/flux-moe",
    "crates/flux-nations",
    "crates/flux-net",
    "crates/flux-optimize",
    "crates/flux-p2p",
    "crates/flux-quantum-architect",
    "crates/flux-quorum",
    "crates/flux-recursive-proofs",
    "crates/flux-refactor",
    "crates/flux-rev",
    "crates/flux-decay",
    "crates/flux-md",
    "crates/flux-science",
    "crates/flux-search",
    "crates/flux-self-heal",
    "crates/flux-sigil-releases",
    "crates/flux-sniff",
    "crates/flux-sqisign",
    "crates/flux-swarm-store",
    "crates/flux-swarm-tools",
    "crates/flux-sync",
    "crates/flux-tip-proof-stir",
    "crates/flux-zk",
    "crates/flux-zk-stark",
    "crates/flux-zk-types",
    "crates/fluxc",
    "crates/fluxc-core",
    "crates/fluxc-mcp",
    "crates/sigil-cosmos-core",
    "crates/sigil-cosmos-mcp",
    "crates/sigil-dao-bridge-mcp",
]
resolver = "2"

[workspace.package]
version = "0.39.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/flux-lang/flux"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
blake3 = "1.5"
sha3 = "0.10"
rand = "0.8"
rand_chacha = "0.3"
hex = "0.4"
bincode = "1.3"
crossbeam = "0.8"
rayon = "1.10"
lazy_static = "1.4"
once_cell = "1.19"
num_cpus = "1.16"
# Arkworks ZK stack (used by flux-zk-snark, flux-ivc, flux-recursive-proofs)
ark-ff = "0.4"
ark-ec = "0.4"
ark-serialize = "0.4"
ark-std = "0.4"
ark-bn254 = "0.4"
ark-bls12-381 = "0.4"
ark-groth16 = "0.4"
ark-poly = "0.4"
ark-poly-commit = "0.4"
ark-r1cs-std = "0.4"
ark-relations = "0.4"
ark-snark = "0.4"
ark-marlin = "0.3"
libp2p = "0.53"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.4"
futures = "0.3"
bytes = "1.5"
rmp-serde = "1.1"
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
rand_core = "0.6"

[profile.dev]
opt-level = 1
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1