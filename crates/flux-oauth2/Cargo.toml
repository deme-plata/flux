[package]
name = "flux-oauth2"
version.workspace = true
edition.workspace = true
description = "Substrate OAuth2 provider for Flux chains. RFC 6749 Authorization Code + RFC 7636 PKCE + wallet-keyed SQIsign authentication (the user IS their wallet, no passwords). Used by flux-vcs for repo invites + the SIGIL wallet web sign-in flow. Spec: ../docs/flux-vcs-spec.md."

# Phase OAUTH2-A: token mint + PKCE verifier + wallet challenge stub. Tokens
# are opaque (32-byte random, hashed at rest, plain in Authorization header),
# stored in flux-db. Provider + HTTP handlers + wire integration land in
# OAUTH2-B/C/D/E/F per the roadmap.
#
# This crate does NOT speak HTTP itself; it produces State + Token state-
# machine transitions a host application threads into its preferred web
# framework (axum, actix, raw hyper). That keeps the substrate transport-
# agnostic.

[dependencies]
serde     = { version = "1", features = ["derive"] }
thiserror = { workspace = true }
# Deterministic RNG seeded per-provider — same install seed always issues
# the same token bytes for the same challenge (auditable, test-friendly).
# Production wiring should re-seed from /dev/urandom at startup; tests pin
# the seed.
rand        = { version = "0.8", default-features = false, features = ["std_rng"] }
rand_chacha = "0.3"
# SHA-256 for PKCE S256 challenge transform (RFC 7636 §4.2).
sha2 = "0.10"
# Base64-URL no-pad for tokens + PKCE encoding (RFC 7636 §4.2).
base64 = "0.21"
# Hex for token hash storage (auditable).
hex = "0.4"

[dev-dependencies]
serde_json = "1"
