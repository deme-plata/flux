[package]
name = "flux-sigil-dashboard"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SIGIL dashboard data generator. FLUXFOOD-compliant: workspace deps, fluxc-built, shared target. Emits sigil-dashboard.json that the wallet's apiShim consumes — status, recent blocks, address balances — so the dashboard shows SIGIL data instead of falling through to the Quillon backend."

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }

[[bin]]
name = "sigil-dashboard"
path = "src/bin/sigil-dashboard.rs"
