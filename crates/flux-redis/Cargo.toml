[package]
name = "flux-redis"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Flux Redis — Redis wire-compatible cache: RESP protocol, lock-free hash table, pub/sub, persistence, io_uring sockets"

[dependencies]
tokio = { version = "1", features = ["full"] }
bytes = "1"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
rand = "0.8"
tracing = "0.1"
